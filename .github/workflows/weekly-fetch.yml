name: Weekly SAP Repos Fetch

on:
  schedule:
    # Every Monday at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required to commit and push sap_top30.json

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT }}  # PAT with repo scope for write access

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Classic PAT with public_repo scope
        run: python fetch_sap_repos.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet sap_top30.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to sap_top30.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in sap_top30.json"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sap_top30.json
          git commit -m "chore: update sap_top30.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}